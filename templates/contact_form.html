<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>תוכנה חישוב שכר</title>
<link rel="stylesheet" href="{{ url_for('static', filename='contact_form.css') }}">
<style>
/* ===== עיצוב לוח שנה צף קומפקטי בצבע שמנת שמתאים לסקריפט לוח שנה צף===== */
.custom-calendar-picker {
    position: absolute; 
    z-index: 9999; 
    background-color: #fdfbf7 !important; /* צבע שמנת עדין */
    border: 1px solid #c2bfae; 
    box-shadow: 0 4px 10px rgba(0,0,0,0.12);
    padding: 8px; 
    width: 210px; /* קטן וקומפקטי יותר */
    font-family: system-ui, -apple-system, sans-serif; 
    display: none; 
    text-align: center; 
    direction: ltr !important;
    border-radius: 6px;
}

/* ניווט עליון - תפריט בחירה מהיר */
.calendar-nav { 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    margin-bottom: 6px; 
    gap: 3px;
}

/* עיצוב רשימות הבחירה של החודש והשנה */
.calendar-nav select {
    background: #f4eee1;
    border: 1px solid #d3cbba;
    font-size: 12px;
    font-weight: bold;
    color: #333 !important;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;    
    width: 2.1cm;
    height: 22px;          
    padding: 0 4px;        
    box-sizing: border-box; 
}

.calendar-nav select:focus {
    outline: none;
    border-color: #8c826b;
}

.calendar-nav button { 
    background: #e8e2d2; 
    border: 1px solid #c8bfa9; 
    font-size: 13px; 
    cursor: pointer; 
    padding: 2px 6px; 
    font-weight: bold; 
    color: #333 !important;
    border-radius: 4px;
}

.calendar-nav button:hover {
    background: #dbd4c0;
}

/* גריד הימים */
.calendar-days-grid { 
    display: grid; 
    grid-template-columns: repeat(7, 1fr); 
    gap: 3px; 
    font-size: 11px; 
    color: #333 !important;
}

.calendar-day-header { 
    font-weight: bold; 
    color: #7c7565 !important; 
    padding-bottom: 3px; 
}

.calendar-day-cell { 
    padding: 4px 0; 
    cursor: pointer; 
    border-radius: 4px; 
    color: #333 !important; 
    font-weight: 500;
    background-color: transparent;
}

.calendar-day-cell:hover:not(.empty) { 
    background: #ebdcb9 !important; 
}

.calendar-day-cell.selected { 
    background: #5a5241 !important; 
    color: #ffffff !important; 
    font-weight: bold; 
}

.calendar-day-cell.empty { 
    cursor: default; 
    background: none !important;
}

/* ===== עיצוב רספונסיבי מאוחד ובינלאומי למובייל (768px ומטה) - דף עובד ===== */
@media screen and (max-width: 768px) {
    body {
        /* מאפשר לתגית ה-html הראשית של הג'ינג'ה לקבוע את כיוון הדף דינמית */
        width: 100% !important;
        margin: 0 !important;
        padding: 10px !important;
        box-sizing: border-box !important;
        overflow-x: hidden !important;
    }

    /* בידוד מיוחד עבור שדה התאריך השקוף בתוך הדיב האבסולוטי במובייל */
    .form-row div[style*="position: relative"] input {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
    }

    /* הוספת עיצוב מיוחג לדף הלקוח התאמה אישית במובייל */
    .container, .form-group, .container form, div[style*="display: flex"] {
        justify-content: center !important;
        text-align: center !important;
        margin-left: 0 !important;
        margin-right: 0 !important;
        width: 100% !important;
    }
    h2 {
        margin-left: 0 !important;
        text-align: center !important;
    }
    .form-group {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100% !important;
        margin-right: 0 !important;
        margin-left: 0 !important;
        gap: 5px;
    }
    .form-group input {
        margin-right: 0 !important;
        margin-left: 0 !important;
    }
    div[style*="display: flex; gap: 10px"] {
        justify-content: center !important;
        width: 100% !important;
        flex-wrap: wrap;
    }

    /* ממרכז את הכותרת הראשית במובייל ומבטל את ההזזה של המחשב */
    .main-title {
        margin-left: 0 !important;
        width: 100% !important;
        text-align: center !important;
        font-weight: 900 !important; /* הדגשה מקסימלית וחזקה לטלפונים */
    }
    
    /* --- ממרכז את תיבת ההודעה במובייל, מבטל את הגלילה וגורם לה להיפתח לפי המילים! --- */
    #message {
        width: 95% !important; /* תופס את רוב רוחב המסך בטלפון */
        height: auto !important; /* מבטל את ה-1.5cm הקשיח */
        min-height: 1.5cm !important; /* גובה התחלתי מינימלי יפה */
        overflow-y: visible !important; /* מאפשר לטקסט לדחוף את התיבה למטה מבלי להיחתך! */
        resize: none; /* מעלים את לחצן הגרירה הידני שיכול להרוס את העיצוב */
    }
</style>

</head>
<body>
    <h1 class="main-title" style="margin-left: 245px; text-align: center; font-weight: bold; font-family: sans-serif;">הוסף או עדכן עובד</h1>

<form method="POST" action="{{ url_for('contact_form') }}" id="form-body">
  <input type="hidden" name="form_type" value="contact_form">
    <input type="hidden" id="employee_id" name="employee_id" value="{{ employee.employee_id if employee else '' }}">

      <div class="form-container">
        <div class="form-column">
            <div class="form-row">
                <label>תאריך</label>
            <input type="text" 
                   name="date" 
                   id="employee_date_input" 
                   data-calendar="true" 
                   required 
                   value="{% if employee_data and employee_data.date %}{{ employee_data.date }}{% else %}{{ today | lang_date }}{% endif %}" 
                   readonly 
                   style="width: 6.45cm; height: 25px; padding: 0 10px; border: 0.5px solid #444; border-radius: 1px; background: #fff; box-sizing: border-box; cursor: pointer;">
            </div>        
            <div class="form-row">
                <label for="employee_name">שם העובד:</label>
<input type="text" id="employee_name" name="employee_name" value="{% if employee_data and employee_data.employee_name %}{{ employee_data.employee_name }}{% elif employee %}{{ employee.employee_name }}{% else %}{% endif %}" style="font-size: 17px; width: 5.35cm;">
            </div>
            <div class="form-row">
                <label for="id_number">מספר זהות:</label>
                <input type="text" id="id_number" name="id_number" value="{% if employee_data and employee_data.id_number %}{{ employee_data.id_number }}{% elif employee %}{{ employee.id_number }}{% else %}{% endif %}" style="width: 5.25cm;">
            </div>
            <div class="form-row">
                <label for="address">כתובת:</label>
                <input type="text" id="address" name="address" value="{% if employee_data and employee_data.address %}{{ employee_data.address }}{% elif employee %}{{ employee.address }}{% else %}{% endif %}" style="font-size: 17px; width: 6.05cm;">
            </div>

<div class="form-row" style="display: flex; align-items: center; gap: 5px; margin-bottom: 10px;">
    <label for="city" style="font-weight: bold; margin: 0;">עיר:</label>
    <input type="text" id="city" name="city"
           value="{% if city_data %}{{ city_data['שם יישוב'] }}{% elif employee_data and employee_data.city %}{{ employee_data.city }}{% elif employee %}{{ employee.city }}{% else %}{% endif %}"
           style="font-size: 17px; width: 3.1cm; margin: 0;">

    <label for="postal_code" style="font-weight: bold; margin: 0;">מיקוד:</label>
    <input type="text" id="postal_code" name="postal_code"
           value="{% if employee_data and employee_data.postal_code %}{{ employee_data.postal_code }}{% elif employee %}{{ employee.postal_code }}{% else %}{% endif %}"
           style="font-size: 15px; width: 1.6cm; margin: 0;">
</div>

<div class="form-row" style="display: flex; align-items: center; gap: 1px; margin-bottom: 10px;">
    <!-- טלפון נייד -->
    <label for="mobile_phone" style="font-weight: bold; margin: 0;">טל' נייד:</label>
    <input type="text" id="mobile_phone" name="phone"
           value="{% if employee_data and employee_data.mobile_phone %}{{ employee_data.mobile_phone }}{% elif form_data %}{{ form_data.mobile_phone }}{% else %}{% endif %}"
           style="font-size: 15px; width: 2.4cm; margin: 0;">

    <!-- טלפון בית -->
    <label for="home_phone" style="font-weight: bold; margin: 0;">בית:</label>
    <input type="text" id="home_phone" name="home_phone"
           value="{% if employee_data and employee_data.home_phone %}{{ employee_data.home_phone }}{% elif form_data %}{{ form_data.home_phone }}{% else %}{% endif %}"
           style="font-size: 15px; width: 2.2cm; margin: 0;">
</div>

            <div class="form-row">
                    <label for="date_of_birth" style="font-size: 1.2em; font-weight: bold; width: 2.6cm; height: 0.3cm;display: flex; align-items: center;">תאריך לידה:</label>
            <input type="text" 
                   name="date_of_birth" 
                   id="date_of_birth_input" 
                   data-calendar="true" 
                   required 
                   value="{% if employee_data and employee_data.date_of_birth %}{{ employee_data.date_of_birth }}{% elif form_data and form_data.date_of_birth %}{{ form_data.date_of_birth }}{% elif employee and employee.date_of_birth %}{{ employee.date_of_birth }}{% else %}{% endif %}" 
                   readonly 
                   style="width: 5cm; height: 25px; padding: 0 10px; border: 0.5px solid #444; border-radius: 1px; background: #fff; box-sizing: border-box; cursor: pointer;">
            </div>        
            <div class="form-row">
                <label for="tax_point_child">ילד נכה נק. זיכוי:</label>
                <input type="text" id="tax_point_child" name="tax_point_child" value="{% if employee_data and employee_data.tax_point_child %}{{ employee_data.tax_point_child }}{% elif employee %}{{ employee.tax_point_child }}{% else %}{% endif %}" style="width: 4.15cm;">
            </div>
        </div>

        <div class="form-column">
   
           <div class="form-row">
                <label for="clothing_value">שווי ביגוד:</label>
<input type="text" id="clothing_value" name="clothing_value" value="{% if employee_data and employee_data.clothing_value %}{{ employee_data.clothing_value }}{% elif employee and employee.clothing_value %}{{ '{:,.2f}'.format(employee.clothing_value|float) }}{% else %}{% endif %}" style="width: 3.9cm;">
            </div>
            <div class="form-row">
                <label for="cars_value">שווי רכב:</label>
<input type="text" id="cars_value" name="cars_value"
       value="{% if formatted_car_value %}{{ formatted_car_value.replace('₪', '') }}{% elif employee and employee.cars_value %}{{ '{:,.2f}'.format(employee.cars_value|float) }}{% else %}{{ '' }}{% endif %}"
       style="width: 4.2cm;">
            </div>
            <div class="form-row">
                <label for="email">מייל:</label>
                <input type="text" id="email" name="email" value="{% if employee_data and employee_data.email %}{{ employee_data.email }}{% elif employee %}{{ employee.email }}{% else %}{% endif %}" style="width: 5.05cm;">
            </div>

            <div class="form-row">
                    <label for="start_date" style="font-size: 1.2em; font-weight: bold; width: 2.6cm; height: 0.3cm;display: flex; align-items: center;">תחילת עבודה:</label>
            <input type="text" 
                   name="start_date" 
                   id="start_date_input" 
                   data-calendar="true" 
                   required 
                   value="{% if employee_data and employee_data.start_date %}{{ employee_data.start_date }}{% elif form_data and form_data.start_date %}{{ form_data.start_date }}{% elif employee and employee.start_date %}{{ employee.start_date }}{% else %}{% endif %}" 
                   readonly 
                   style="width: 3.6cm; height: 25px; padding: 0 10px; border: 0.5px solid #444; border-radius: 1px; background: #fff; box-sizing: border-box; cursor: pointer;">
            </div>        

            <div class="form-row">
                    <label for="aliyah_date" style="font-size: 1.2em; font-weight: bold; width: 2.6cm; height: 0.3cm;display: flex; align-items: center;">תאריך עלייה:</label>
            <input type="text" 
                   name="aliyah_date" 
                   id="aliyah_date_input" 
                   data-calendar="true" 
                   required 
                   value="{% if employee_data and employee_data.aliyah_date %}{{ employee_data.aliyah_date }}{% elif form_data and form_data.aliyah_date %}{{ form_data.aliyah_date }}{% elif employee and employee.aliyah_date %}{{ employee.aliyah_date }}{% else %}{% endif %}" 
                   readonly 
                   style="width: 3.6cm; height: 25px; padding: 0 10px; border: 0.5px solid #444; border-radius: 1px; background: #fff; box-sizing: border-box; cursor: pointer;">
            </div>        

<div class="form-row" style="display: flex; align-items: center; gap: 5px; margin-bottom: 10px;">
    <!-- מספר בנק -->
    <label for="bank_number" style="font-weight: bold; margin: 0;">מס' בנק:</label>
    <input type="text" id="bank_number" name="bank_number" 
           value="{% if employee_data and employee_data.bank_number %}{{ employee_data.bank_number }}{% elif employee %}{{ employee.bank_number }}{% else %}{% endif %}" 
           style="font-size: 15px; width: 1.4cm; margin: 0;">

    <!-- מספר סניף -->
     <label for="branch_number" style="font-weight: bold; margin: 0;">סניף:</label>
    <input type="text" id="branch_number" name="branch_number" 
           value="{% if employee_data and employee_data.branch_number %}{{ employee_data.branch_number }}{% elif employee %}{{ employee.branch_number }}{% else %}{% endif %}" 
           style="font-size: 15px; width: 1.4cm; margin: 0;">
</div>

            <div class="form-row">
                <label for="account_number">חשבון בנק:</label>
                <input type="text" id="account_number" name="account_number" value="{% if employee_data and employee_data.account_number %}{{ employee_data.account_number }}{% elif employee %}{{ employee.account_number }}{% else %}{% endif %}" style="width: 3.85cm;">
            </div>
            <div class="form-row">
                <label for="tax_credit_points">נקודות זיכוי מס:</label>
                <input type="text" id="tax_credit_points" name="tax_credit_points" value="{% if employee_data and employee_data.tax_credit_points %}{{ employee_data.tax_credit_points }}{% elif employee %}{{ employee.tax_credit_points }}{% else %}{% endif %}" style="width: 2.95cm;">
            </div>
        </div>
 
           <div class="form-column">

            <div class="form-row">
                <label for="monthly_city_tax_tops">סכום זיכוי ישוב חודשי:</label>
<input type="text" id="monthly_city_tax_tops" name="monthly_city_tax_tops"
       value="{% if formatted_monthly_city_top_tax %}{{ formatted_monthly_city_top_tax.replace('₪', '') }}{% elif employee and employee.monthly_city_tax_tops %}{{ '{:,.2f}'.format(employee.monthly_city_tax_tops|float) }}{% else %}{{ '' }}{% endif %}"
       style="width: 1.95cm;">
            </div>
            <div class="form-row">
    <label for="city_value_percentage" style="font-size: 1.2em; font-weight: bold; width: 4.4cm; height: 0.3cm;display: flex; align-items: center;">אחוז זיכוי ישוב מיוחד:</label>
<input type="text" id="city_value_percentage" name="city_value_percentage"
value="{% if city_data and city_data['שיעור 2024'] %}{{ city_data['שיעור 2024'].replace('%', '') }}{% elif employee and employee.city_value_percentage %}{{ '{:.2f}'.format(employee.city_value_percentage) }}{% else %}{{ '' }}{% endif %}"
       style="width: 1.9cm; height: 0.5cm; font-weight: bold; font-size: 0.9em;">
            </div> 
            <div class="form-row">
                <label for="lunch_value">שווי ארוחת צהריים:</label>
<input type="text" id="lunch_value" name="lunch_value" value="{% if employee_data and employee_data.lunch_value %}{{ employee_data.lunch_value }}{% elif employee and employee.lunch_value %}{{ '{:,.2f}'.format(employee.lunch_value|float) }}{% else %}{% endif %}" style="width: 2.55cm;">
            </div>
            <div class="form-row">
                <label for="mobile_value">שווי טלפון נייד:</label>
<input type="text" id="mobile_value" name="mobile_value" value="{% if employee_data and employee_data.mobile_value %}{{ employee_data.mobile_value }}{% elif employee and employee.mobile_value %}{{ '{:,.2f}'.format(employee.mobile_value|float) }}{% else %}{% endif %}" style="width: 3.3cm;">
            </div>
            <div class="form-row">
                <label for="hourly_rate">תעריף לשעה:</label>
<input type="text" id="hourly_rate" name="hourly_rate" value="{% if employee_data and employee_data.hourly_rate %}{{ employee_data.hourly_rate }}{% elif employee and employee.hourly_rate %}{{ '{:,.2f}'.format(employee.hourly_rate|float) }}{% else %}{% endif %}" style="width: 3.75cm;">
            </div>
            <div class="form-row">
                <label for="employee_number">מספר עובד:</label>
<input type="text" id="employee_number" name="employee_number" value="{% if employee_data and employee_data.employee_number %}{{ employee_data.employee_number }}{% elif employee %}{{ employee.employee_number }}{% else %}{% endif %}" style="width: 4.15cm;">
            </div>
            <div class="form-row">
                <label for="thirteenth_salary">משכורת י"ג:</label>
<input type="text" id="thirteenth_salary" name="thirteenth_salary" value="{% if employee_data and employee_data.thirteenth_salary %}{{ employee_data.thirteenth_salary }}{% elif employee and employee.thirteenth_salary %}{{ '{:,.2f}'.format(employee.thirteenth_salary|float) }}{% else %}{% endif %}" style="width: 3.9cm;">
            </div>
            <div class="form-row">
                <label for="work_percent">הסכם העסקה:</label>
                <input type="text" id="work_percent" name="work_percent" value="{% if employee_data and employee_data.work_percent %}{{ employee_data.work_percent }}{% elif employee %}{{ employee.work_percent }}{% else %}{% endif %}" style="width: 3.8cm;">
            </div>
        </div>

        <div class="form-row" style="height: 0.9cm;">
            <div class="form-row">
                <div class="form-row" style="display: flex; flex-direction: column; margin-bottom: 0.001em;">
                    <label for="message" style="font-size: 1em; font-weight: bold; margin-bottom: 0.01px;">הודעה:</label>
                    <textarea id="message" name="message" rows="5" style="width: 14.15cm; height: 1.5cm; font-size: 21px; font-weight: bold; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">{% if employee_data and employee_data.message %}{{ employee_data.message }}{% elif employee %}{{ employee.message }}{% else %}{% endif %}</textarea>
                </div>
            </div>
        </div>
    </div>
</div>

<!--  Combobox -->

{% if employee_data is not defined or not employee_data %}{% set employee_data = {} %}{% endif %}

<div class="form-container">
    <div class="form-column">
        <!-- Work Apartment -->
        <div class="form-row">
            <label for="work_apartment">מחלקה עובד:</label>
            <select id="work_apartment" name="work_apartment" class="form-select" style="width: 4.25cm; display: flex; align-items: center; height: 0.7cm;">
                <option value="" {% if not employee.work_apartment and not employee_data.get('work_apartment') %}selected{% endif %}></option>
                <option value="נהג/ת" {% if employee.work_apartment == "נהג/ת" or employee_data.get('work_apartment') == "נהג/ת" %}selected{% endif %}>נהג/ת</option>
                <option value="מזכיר/ה" {% if employee.work_apartment == "מזכיר/ה" or employee_data.get('work_apartment') == "מזכיר/ה" %}selected{% endif %}>מזכיר/ה</option>
                <option value="מנהל/ת חשבונות" {% if employee.work_apartment == "מנהל/ת חשבונות" or employee_data.get('work_apartment') == "מנהל/ת חשבונות" %}selected{% endif %}>מנהל/ת חשבונות</option>
                <option value="אחזקה" {% if employee.work_apartment == "אחזקה" or employee_data.get('work_apartment') == "אחזקה" %}selected{% endif %}>אחזקה</option>
                <option value="נקיון" {% if employee.work_apartment == "נקיון" or employee_data.get('work_apartment') == "נקיון" %}selected{% endif %}>נקיון</option>
                <option value="מיחשוב" {% if employee.work_apartment == "מיחשוב" or employee_data.get('work_apartment') == "מיחשוב" %}selected{% endif %}>מיחשוב</option>
            </select>
        </div>

        <!-- Marital Status -->
        <div class="form-row">
            <label for="marital_status">מצב משפחתי:</label>
            <select id="marital_status" name="marital_status" class="form-select" style="width: 4.1cm; display: flex; align-items: center; height: 0.7cm;">
                <option value="" {% if not employee.marital_status and not employee_data.get('marital_status') %}selected{% endif %}></option>
                <option value="רווק/ה" {% if employee.marital_status == "רווק/ה" or employee_data.get('marital_status') == "רווק/ה" %}selected{% endif %}>רווק/ה</option>
                <option value="נשוי/אה" {% if employee.marital_status == "נשוי/אה" or employee_data.get('marital_status') == "נשוי/אה" %}selected{% endif %}>נשוי/אה</option>
                <option value="גרוש/ה" {% if employee.marital_status == "גרוש/ה" or employee_data.get('marital_status') == "גרוש/ה" %}selected{% endif %}>גרוש/ה</option>
                <option value="אלמן/ה" {% if employee.marital_status == "אלמן/ה" or employee_data.get('marital_status') == "אלמן/ה" %}selected{% endif %}>אלמן/ה</option>
                <option value="פרוד/ה" {% if employee.marital_status == "פרוד/ה" or employee_data.get('marital_status') == "פרוד/ה" %}selected{% endif %}>פרוד/ה</option>

<!--  Click Keyboard Up Down ניווט עם חצים  -->
<script>
document.addEventListener('DOMContentLoaded', function () {
    const formBody = document.getElementById('form-body');
    if (formBody) {
        const allFields = Array.from(formBody.querySelectorAll('input, textarea, select'));

        // ניווט עם חצים
        formBody.addEventListener('keydown', function (event) {
            const key = event.key;
            const current = event.target;
            const index = allFields.indexOf(current);

            if (index === -1) return;

            if (key === 'ArrowDown' && index < allFields.length - 1) {
                allFields[index + 1].focus();
                event.preventDefault();
            }
            if (key === 'ArrowUp' && index > 0) {
                allFields[index - 1].focus();
                event.preventDefault();
            }
        });

        // הדגשה כששדה נבחר
        allFields.forEach(field => {
            field.addEventListener('focus', () => {
                field.style.backgroundColor = '#e6f7ff';
                field.style.outline = '1px solid #007bff';
            });
            field.addEventListener('blur', () => {
                field.style.backgroundColor = '';
                field.style.outline = '';
            });
        });
    }
});
</script>


<!-- לוח שנה צף קומפקטי בצבע שמנת סקריפט  -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    // 1. קריאה ישירה של השפה הפעילה מתוך ה-Cookie של המערכת שלך
    const currentLang = document.cookie.split('; ').find(row => row.startsWith('lang='))?.split('=')[1] || localStorage.getItem("lang") || "he";

    // 2. חילוץ שמות החודשים המתורגמים הרשמיים מהדפדפן לפי השפה
    const translatedMonths = Array.from({ length: 12 }, (_, i) => {
        return new Intl.DateTimeFormat(currentLang, { month: 'long' }).format(new Date(2026, i, 1));
    });

    // 3. חילוץ אוטומטי של ימי השבוע המקוצרים מהדפדפן לפי השפה הפעילה (א'-ש' בעברית, Lu-Do בספרדית וכו')
    const daysWeek = Array.from({ length: 7 }, (_, i) => {
        const date = new Date(2026, 5, 21 + i); // 21 ביוני 2026 הוא יום ראשון
        return new Intl.DateTimeFormat(currentLang, { weekday: currentLang === 'he' ? 'narrow' : 'short' }).format(date);
    });

    // 4.  פירוק ידני קשיח ובטוח לפי חוקי ה-main.py שלך - מונע לחלוטין את הקריסה בימים 13-31!
    function parseDateByLang(dateStr, lang) {
        if (!dateStr) return null;
        
        const parts = dateStr.trim().split('-');
        if (parts.length !== 3) return null;

        let year, month, day;

        // בדיקה חכמה: אם החלק הראשון הוא באורך 4 ספרות (פורמט בינלאומי גולמי של השרת YYYY-MM-DD)
        if (parts[0].length === 4) {
            year = parseInt(parts[0], 10);
            month = parseInt(parts[1], 10) - 1;
            day = parseInt(parts[2], 10);
        } 
        // פורמט ארה"ב (אנגלית): MM-DD-YYYY
        else if (lang === "en") {
            month = parseInt(parts[0], 10) - 1;
            day = parseInt(parts[1], 10);
            year = parseInt(parts[2], 10);
        } 
        // פורמט ישראל ואירופה (עברית, ספרדית וכו'): DD-MM-YYYY
        else {
            day = parseInt(parts[0], 10);
            month = parseInt(parts[1], 10) - 1;
            year = parseInt(parts[2], 10);
        }

        // בדיקת בטיחות קשיחה כדי למנוע יצירת ערכים שבורים
        if (isNaN(year) || isNaN(month) || isNaN(day) || month < 0 || month > 11 || day < 1 || day > 31) {
            return null;
        }
        
        // מחזיר אובייקט נתונים נקי במקום אובייקט Date מובנה שמתבלבל בין ימים לחודשים
        return { year, month, day };
    }

    function formatDateByLang(year, monthIndex, day, lang) {
        const d = String(day).padStart(2, '0');
        const m = String(monthIndex + 1).padStart(2, '0');
        const y = year;

        if (lang === "en") return `${m}-${d}-${y}`; // MM-DD-YYYY
        if (["zh", "ja", "ko"].includes(lang)) return `${y}-${m}-${d}`; // YYYY-MM-DD
        return `${d}-${m}-${y}`; // DD-MM-YYYY
    }

    // 5. יצירה והזרקה אוטומטית של אלמנט הלוח שנה לדף
    const calendar = document.createElement('div');
    calendar.id = 'customCalendarPicker';
    calendar.className = 'custom-calendar-picker';
    calendar.innerHTML = `
        <div class="calendar-nav">
            <button id="calPrevBtn" type="button">&lt;</button>
            <div style="display: flex; gap: 4px;">
                <select id="calMonthSelect"></select>
                <select id="calYearSelect"></select>
            </div>
            <button id="calNextBtn" type="button">&gt;</button>
        </div>
        <div id="calendarGrid" class="calendar-days-grid"></div>
    `;
    document.body.appendChild(calendar);

    const monthSelect = document.getElementById('calMonthSelect');
    const yearSelect = document.getElementById('calYearSelect');
    const grid = document.getElementById('calendarGrid');
    let activeInput = null;
    
    let currentDate = new Date();
    let displayedMonth = currentDate.getMonth();
    let displayedYear = currentDate.getFullYear();

    function initSelectOptions() {
        monthSelect.innerHTML = '';
        translatedMonths.forEach((m, idx) => {
            monthSelect.innerHTML += `<option value="${idx}">${m}</option>`;
        });

        yearSelect.innerHTML = '';
        const currentYearNum = new Date().getFullYear();
        for (let y = currentYearNum + 10; y >= currentYearNum - 100; y--) {
            yearSelect.innerHTML += `<option value="${y}">${y}</option>`;
        }
    }

    function renderCalendar() {
        grid.innerHTML = '';

        monthSelect.value = displayedMonth;
        yearSelect.value = displayedYear;

        daysWeek.forEach(d => {
            grid.innerHTML += `<div class="calendar-day-header">${d}</div>`;
        });

        const firstDayIndex = new Date(displayedYear, displayedMonth, 1).getDay();
        const totalDays = new Date(displayedYear, displayedMonth + 1, 0).getDate();

        for (let i = 0; i < firstDayIndex; i++) {
            grid.innerHTML += `<div class="calendar-day-cell empty"></div>`;
        }

        let selectedDay = null;
        if (activeInput && activeInput.value && activeInput.value !== "---") {
            const parsed = parseDateByLang(activeInput.value, currentLang);
            if (parsed && parsed.year === displayedYear && parsed.month === displayedMonth) {
                selectedDay = parsed.day;
            }
        }

        for (let day = 1; day <= totalDays; day++) {
            const isSelected = (day === selectedDay) ? 'selected' : '';
            grid.innerHTML += `<div class="calendar-day-cell ${isSelected}" data-day="${day}">${day}</div>`;
        }

        grid.querySelectorAll('.calendar-day-cell:not(.empty)').forEach(cell => {
            cell.onclick = function(e) {
                e.stopPropagation();
                if (!activeInput) return;

                const day = parseInt(this.getAttribute('data-day'), 10);
                activeInput.value = formatDateByLang(displayedYear, displayedMonth, day, currentLang);
                
                // שליחת אירועי עדכון מלאים עם bubbles כדי שכל הדף ומנוע הפייתון יזהו את השינוי ב-POST
                activeInput.dispatchEvent(new Event('input', { bubbles: true }));
                activeInput.dispatchEvent(new Event('change', { bubbles: true }));
                
                calendar.style.display = 'none';
            };
        });
    }

    monthSelect.addEventListener('change', (e) => {
        displayedMonth = parseInt(e.target.value);
        renderCalendar();
    });

    yearSelect.addEventListener('change', (e) => {
        displayedYear = parseInt(e.target.value);
        renderCalendar();
    });

    document.getElementById('calPrevBtn').onclick = (e) => {
        e.stopPropagation();
        displayedMonth--;
        if (displayedMonth < 0) {
            displayedMonth = 11;
            displayedYear--;
        }
        renderCalendar();
    };

    document.getElementById('calNextBtn').onclick = (e) => {
        e.stopPropagation();
        displayedMonth++;
        if (displayedMonth > 11) {
            displayedMonth = 0;
            displayedYear++;
        }
        renderCalendar();
    };

    // פונקציית פתיחה מאוחדת ומאובטחת שמחשבת מיקום מדויק של הלוח
    function openCalendar(targetInput) {
        activeInput = targetInput;
        initSelectOptions();
        
        let today = new Date();
        displayedMonth = today.getMonth();
        displayedYear = today.getFullYear();
        
        if (activeInput.value && activeInput.value.trim() !== "" && activeInput.value !== "---") {
            const parsed = parseDateByLang(activeInput.value, currentLang);
            if (parsed) {
                displayedMonth = parsed.month;
                displayedYear = parsed.year;
            }
        }

        renderCalendar();

        const rect = activeInput.getBoundingClientRect();
        calendar.style.top = (rect.bottom + window.scrollY) + 'px';
        calendar.style.left = (rect.left + window.scrollX) + 'px';
        calendar.style.display = 'block';
    }

    // הגנה כפולה לפתיחה: מגיב חלק גם בפוקוס (טפסים) וגם בקליק עכבר ישיר (טבלאות וגרידים)
    document.body.addEventListener('focusin', function(e) {
        if (e.target.matches('input[data-calendar="true"]')) {
            openCalendar(e.target);
        }
    });

    document.body.addEventListener('click', function(e) {
        if (e.target.matches('input[data-calendar="true"]')) {
            e.preventDefault();
            e.stopPropagation();
            openCalendar(e.target);
        }
    });

    document.addEventListener('click', function(e) {
        if (!calendar.contains(e.target) && activeInput && e.target !== activeInput) {
            calendar.style.display = 'none';
        }
    });
    
    calendar.onclick = (e) => e.stopPropagation();
});
</script>


<!--  Contact Search Run Auto Search CITY Results הנחת יישוב בהזנת עיר בפורם  -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    const upperCityInput = document.getElementById('city'); 
    const lowerCityInput = document.getElementById('city_name');
    
    //  קורא את הדגל החם ישירות מהפייתון של השרת!
    const shouldRunAutoCity = "{{ form_data.get('run_auto_city', False) | lower }}";

    if (upperCityInput && lowerCityInput) {
        
        function runAutoCitySync() {
            const cityName = upperCityInput.value.trim();
            if (!cityName) return;

            console.log("🔄 מערכת המאסטר מריצה חישוב פנדה אוטומטי ומאובטח עבור:", cityName);
            lowerCityInput.value = cityName;

            const cityForm = lowerCityInput.closest('form');
            const upperForm = upperCityInput.closest('form');

            if (cityForm && upperForm) {
                const inputs = upperForm.querySelectorAll('input, select, textarea');
                inputs.forEach(input => {
                    if (input.name && input.name !== 'form_type' && input.name !== 'city_name') {
                        let hiddenField = cityForm.querySelector(`input[name="${input.name}"]`);
                        if (!hiddenField) {
                            hiddenField = document.createElement('input');
                            hiddenField.type = 'hidden';
                            hiddenField.name = input.name;
                            cityForm.appendChild(hiddenField);
                        }
                        hiddenField.value = input.value;
                    }
                });
                
                cityForm.submit();
            }
        }

        //  מריץ את החישוב בטעינה אך ורק אם המשתמש הגיע הרגע פיזית מדף העובדים (הדגל הוא true)!
        if (upperCityInput.value.trim() !== "" && shouldRunAutoCity === "true") {
            setTimeout(runAutoCitySync, 100);
        }

        // מקשיב לשינויים ידניים אם המשתמש משנה עיר באופן אקטיבי על המסך
        upperCityInput.addEventListener('change', runAutoCitySync);
    }
});
</script>

<!-- MOBILE TEXTORA סקריפט נפרד ועצמאי לניהול גובה תיבת ההודעה דינמית במובייל בלבד -->
<script>
(function() {
    function autoExpandMessage() {
        const txtArea = document.getElementById('message');
        if (!txtArea) return;

        // החישוב הדינמי רץ רק אם המשתמש נמצא במובייל (מסך קטן מ-768 פיקסלים)
        if (window.innerWidth <= 768) {
            txtArea.style.height = 'auto'; // מאפס את הגובה זמנית לצורך החישוב הנקי
            
            // מחשב את הגובה האמיתי של כל השורות (אפילו 37 שורות) ומוסיף מרווח ביטחון של 15 פיקסלים
            txtArea.style.height = (txtArea.scrollHeight + 15) + 'px'; 
        } else {
            // בדסקטופ מחזיר לגובה העיצוב המקורי שלכם
            txtArea.style.height = '1.5cm';
        }
    }

    // 1. רשת ביטחון: מריץ את החישוב מיד כשהדף מסיים להיטען מחדש (Reload)
    window.addEventListener('load', autoExpandMessage);
    document.addEventListener('DOMContentLoaded', autoExpandMessage);

    // 2. האזנה אקטיבית: אם המשתמש מקליד או משנה את הטקסט, התיבה גדלה איתו בזמן אמת
    document.addEventListener('input', function(e) {
        if (e.target && e.target.id === 'message') {
            autoExpandMessage();
        }
    });

    // 3. האזנה לשינוי גודל המסך (למקרה שהפכו את הטלפון לרוחב)
    window.addEventListener('resize', autoExpandMessage);
})();
</script>
